<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in Stepura</title>
<meta name="apple-itunes-app" content="app-id=6806730489">
<meta name="description" content="Open this in Stepura, the free step counter and walking expedition app.">
<style>
  :root {
    --bg: #0d1b2a; --card: #14263a; --line: #22384f;
    --text: #f2f6fa; --muted: #9fb3c8; --accent: #35c2a0; --accent-ink: #052019;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .mark {
    width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 20px;
    background: linear-gradient(160deg, #35c2a0, #1b7f9e);
    display: grid; place-items: center; font-size: 34px;
  }
  h1 { font-size: 24px; line-height: 1.25; margin: 0 0 10px; letter-spacing: -0.01em; }
  p { color: var(--muted); margin: 0 0 24px; }
  .btn {
    display: block; padding: 15px 20px; border-radius: 12px;
    font-weight: 600; text-decoration: none; margin-bottom: 10px;
  }
  .primary { background: var(--accent); color: var(--accent-ink); }
  .secondary { background: var(--card); color: var(--text); border: 1px solid var(--line); }
  .note { font-size: 13px; color: var(--muted); margin: 18px 0 0; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f7fa; --card: #ffffff; --line: #dde5ec;
      --text: #0d1b2a; --muted: #5a6e82;
    }
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">🥾</div>
  <h1 id="headline">Open this in Stepura</h1>
  <p id="sub">Stepura is a free step counter that turns your daily walk into an expedition.</p>
  <a class="btn primary" id="open" href="stepura://go/home">Open the app</a>
  <a class="btn secondary" href="https://apps.apple.com/app/id6806730489">Get Stepura on the App Store</a>
  <p class="note">If the app is already installed and up to date, this link opens it directly.</p>
</main>
<script>
  // The path says where the walker meant to land. The app claims /go/* through
  // its associated domain, so this page is only ever reached when the app is
  // missing or too old to have claimed it -- which is exactly when a plain,
  // honest web page beats a dead end.
  var PATHS = {
    'challenges': ['Challenges', 'See this month’s challenge in Stepura'],
    'streak': ['Streak', 'Check your streak in Stepura'],
    'insights': ['Insights', 'See your walking trends in Stepura'],
    'settings': ['Settings', 'Open Stepura settings'],
    'home': ['Home', 'Open this in Stepura'],
    'route': ['Route', 'See this route in Stepura']
  };
  var parts = location.pathname.replace(/^\/go\/?/, '').split('/').filter(Boolean);
  var key = parts[0] || 'home';
  var known = PATHS[key];
  if (known) { document.getElementById('headline').textContent = known[1]; }
  document.getElementById('open').setAttribute(
    'href', 'stepura://go/' + parts.join('/')
  );
</script>
</body>
</html>
